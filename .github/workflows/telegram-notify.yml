name: Telegram PR Notifications

on:
  pull_request:
    types: [opened, reopened, review_requested, closed]
  pull_request_review:
    types: [submitted]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build message
        id: msg
        env:
          PR_TITLE:   ${{ github.event.pull_request.title }}
          PR_NUMBER:  ${{ github.event.pull_request.number }}
          PR_URL:     ${{ github.event.pull_request.html_url }}
          PR_AUTHOR:  ${{ github.event.pull_request.user.login }}
          PR_BASE:    ${{ github.event.pull_request.base.ref }}
          PR_HEAD:    ${{ github.event.pull_request.head.ref }}
          PR_BODY:    ${{ github.event.pull_request.body }}
          EVENT:      ${{ github.event_name }}
          ACTION:     ${{ github.event.action }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER:   ${{ github.event.review.user.login }}
        run: |
          # Determine emoji and action label
          if [ "$EVENT" = "pull_request_review" ]; then
            case "$REVIEW_STATE" in
              approved)          EMOJI="✅"; LABEL="PR Approvata" ;;
              changes_requested) EMOJI="🔄"; LABEL="Modifiche Richieste" ;;
              commented)         EMOJI="💬"; LABEL="Commento su PR" ;;
              *)                 EMOJI="👀"; LABEL="Review PR" ;;
            esac
          else
            case "$ACTION" in
              opened|reopened)       EMOJI="🆕"; LABEL="Nuova PR Aperta" ;;
              review_requested)      EMOJI="👀"; LABEL="Review Richiesta" ;;
              closed)
                if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
                  EMOJI="🎉"; LABEL="PR Mergiata!"
                else
                  EMOJI="❌"; LABEL="PR Chiusa"
                fi
                ;;
              *) EMOJI="🔔"; LABEL="PR Aggiornata" ;;
            esac
          fi

          # Get changed files
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git cat-file -e "$BASE" 2>/dev/null && git cat-file -e "$HEAD" 2>/dev/null; then
            FILES=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null | head -20 | sed 's/^/  • /' | tr '\n' '\n')
            STATS=$(git diff --shortstat "$BASE" "$HEAD" 2>/dev/null || echo "")
          else
            FILES=""
            STATS=""
          fi

          # Build message
          MSG="${EMOJI} *${LABEL}*

  📌 *#${PR_NUMBER}* — ${PR_TITLE}
  👤 Autore: \`${PR_AUTHOR}\`
  🌿 \`${PR_HEAD}\` → \`${PR_BASE}\`"

          if [ -n "$REVIEWER" ] && [ "$EVENT" = "pull_request_review" ]; then
            MSG="${MSG}
  🧑‍⚖️ Reviewer: \`${REVIEWER}\`"
          fi

          if [ -n "$STATS" ]; then
            MSG="${MSG}
  📊 ${STATS}"
          fi

          if [ -n "$FILES" ]; then
            MSG="${MSG}
  📁 File modificati:
  ${FILES}"
          fi

          MSG="${MSG}
  🔗 [Apri PR](${PR_URL})"

          # Escape for JSON
          MSG_ESCAPED=$(echo "$MSG" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          echo "message=$MSG_ESCAPED" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
              \"text\": ${{ steps.msg.outputs.message }},
              \"parse_mode\": \"Markdown\",
              \"disable_web_page_preview\": false
            }"
