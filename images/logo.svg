<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <!-- Background pill -->
  <rect width="120" height="40" rx="8" fill="#0d1117"/>

  <!-- "G" letter mark -->
  <text x="12" y="28" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="22" font-weight="700" fill="#58a6ff">G</text>

  <!-- Dot accent -->
  <circle cx="31" cy="24" r="3" fill="#7c3aed"/>

  <!-- Divider -->
  <line x1="42" y1="10" x2="42" y2="30" stroke="#30363d" stroke-width="1.5"/>

  <!-- "peluso" text -->
  <text x="50" y="25" font-family="'Inter', Arial, sans-serif"
        font-size="13" font-weight="600" fill="#e6edf3" letter-spacing="0.5">peluso</text>

  <!-- Underline accent on "peluso" -->
  <line x1="50" y1="29" x2="108" y2="29" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
